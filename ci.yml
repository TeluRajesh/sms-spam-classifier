name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-api.txt
      - run: pip install -r requirements-api.txt
      - name: Train model
        run: python train.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
